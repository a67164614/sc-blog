services:
  firefly:
    image: firefly-blog:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        DISABLE_REMOTE_FONTS: ${DISABLE_REMOTE_FONTS:-1}
        DISABLE_OG_IMAGES: ${DISABLE_OG_IMAGES:-1}
    ports:
      - "${FIREFLY_PORT:-36055}:80"
    restart: unless-stopped
