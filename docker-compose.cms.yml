services:
  firefly:
    depends_on:
      directus:
        condition: service_healthy

  cms-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${CMS_DB_NAME:-firefly_cms}
      POSTGRES_USER: ${CMS_DB_USER:-firefly}
      POSTGRES_PASSWORD: ${CMS_DB_PASSWORD:?set CMS_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
    volumes:
      - cms-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  directus:
    image: directus/directus:11.14.0
    depends_on:
      cms-db:
        condition: service_healthy
    environment:
      KEY: ${DIRECTUS_KEY:?set DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET:?set DIRECTUS_SECRET}
      PUBLIC_URL: ${CMS_PUBLIC_URL:?set CMS_PUBLIC_URL}
      DB_CLIENT: pg
      DB_HOST: cms-db
      DB_PORT: 5432
      DB_DATABASE: ${CMS_DB_NAME:-firefly_cms}
      DB_USER: ${CMS_DB_USER:-firefly}
      DB_PASSWORD: ${CMS_DB_PASSWORD:?set CMS_DB_PASSWORD}
      ADMIN_EMAIL: ${CMS_ADMIN_EMAIL:?set CMS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${CMS_ADMIN_PASSWORD:?set CMS_ADMIN_PASSWORD}
    volumes:
      - cms-uploads:/directus/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8055/server/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  cms-admin-access:
    image: postgres:17-alpine
    depends_on:
      directus:
        condition: service_healthy
    environment:
      PGHOST: cms-db
      PGPORT: 5432
      PGDATABASE: ${CMS_DB_NAME:-firefly_cms}
      PGUSER: ${CMS_DB_USER:-firefly}
      PGPASSWORD: ${CMS_DB_PASSWORD:?set CMS_DB_PASSWORD}
      CMS_ADMIN_EMAIL: ${CMS_ADMIN_EMAIL:?set CMS_ADMIN_EMAIL}
    volumes:
      - ./cms/grant-admin-policy.sql:/cms/grant-admin-policy.sql:ro
    command:
      ["sh", "-ec", "psql --set=ON_ERROR_STOP=1 --set=admin_email=\"$$CMS_ADMIN_EMAIL\" --file=/cms/grant-admin-policy.sql"]
    restart: "no"

  publisher:
    build:
      context: .
      dockerfile: services/publisher/Dockerfile
    depends_on:
      cms-bootstrap:
        condition: service_completed_successfully
    environment:
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_SERVICE_TOKEN: ${DIRECTUS_SERVICE_TOKEN:?set DIRECTUS_SERVICE_TOKEN}
      PUBLISHER_INTERNAL_TOKEN: ${PUBLISHER_INTERNAL_TOKEN:?set PUBLISHER_INTERNAL_TOKEN}
      CONTENT_REPOSITORY: ${CONTENT_REPOSITORY:?set CONTENT_REPOSITORY}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Sc Blog CMS}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:?set GIT_AUTHOR_EMAIL}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      PUBLISHER_PORT: 8787
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  cms-bootstrap:
    image: node:24-alpine
    depends_on:
      cms-admin-access:
        condition: service_completed_successfully
    environment:
      DIRECTUS_URL: http://directus:8055
      CMS_ADMIN_EMAIL: ${CMS_ADMIN_EMAIL:?set CMS_ADMIN_EMAIL}
      CMS_ADMIN_PASSWORD: ${CMS_ADMIN_PASSWORD:?set CMS_ADMIN_PASSWORD}
    volumes:
      - ./cms:/cms:ro
    command: ["node", "/cms/bootstrap.mjs"]
    restart: "no"

volumes:
  cms-db-data:
  cms-uploads:
