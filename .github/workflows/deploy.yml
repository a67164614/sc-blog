name: Deploy Firefly

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "nginx.conf"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

concurrency:
  group: firefly-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -eu
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/firefly_deploy_key"
          chmod 600 "$HOME/.ssh/firefly_deploy_key"
          ssh-keyscan -p "${SERVER_PORT:-22}" -H "$SERVER_HOST" >> "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/firefly_deploy_key" -p "${SERVER_PORT:-22}" "$SERVER_USER@$SERVER_HOST" '
            set -eu
            cd /opt/firefly/sc-blog
            git pull --ff-only origin main
            docker compose up -d --build
          '
