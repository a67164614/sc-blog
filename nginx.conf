server {
	listen 80;
	listen [::]:80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	resolver 127.0.0.11 ipv6=off valid=30s;
	set $directus_upstream http://directus:8055;

	location = /admin {
		return 301 /admin/;
	}

	location ^~ /admin/ {
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_pass $directus_upstream;
	}

	# Directus admin uses these same-origin API endpoints. Keep the explicit list
	# narrow so public Astro routes continue to be served as static files.
	location ~ ^/(auth|server|files|items|users|roles|permissions|policies|access|collections|fields|relations|presets|activity|revisions|versions|comments|notifications|shares|operations|flows|folders|panels|dashboards|extensions|translations|settings|utils|graphql)(/|$) {
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_pass $directus_upstream;
	}

	# Firefly and Directus both use /assets. Serve existing blog assets first.
	location ^~ /assets/ {
		try_files $uri @directus_assets;
	}

	location @directus_assets {
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_pass $directus_upstream;
	}

	location ^~ /_astro/ {
		try_files $uri =404;
		access_log off;
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	location / {
		try_files $uri $uri/ /404.html;
	}
}
